[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "starcat-recsys-trainer"
version = "0.1.0"
description = "Starcat 推荐数据与离线训练管道"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "dong4j" }]
dependencies = [
  "duckdb>=1.3,<2",
  "google-cloud-bigquery>=3.35,<4",
  "httpx>=0.28,<1",
  "numpy>=2.1,<3",
  "pyarrow>=19,<23",
  "pyyaml>=6.0,<7",
  "scipy>=1.15,<2",
  "scikit-learn>=1.6,<2",
]

[project.scripts]
starcat-recsys = "starcat_recsys.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/starcat_recsys"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["starcat_recsys"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["starcat_recsys"]

[tool.coverage.report]
show_missing = true
skip_covered = true
