run_id: gharchive-local-2016-20261031-v14
workspace: ../workspace/training/gharchive-local-2016-20261031-v14
registry: ../workspace/training/registry
random_seed: 42

sources:
  - type: local_lake_partitions
    workspace: ../workspace/bigquery/watch-events-2016-2026
    dataset: watch_events
    start_date: "2016-01-01"
    end_date: "2026-10-31"
    verify_checksums: true
  - type: github_api
    repo_ids_from_canonical: true
    repository_limit: 5000
    maximum_requests: 5000
    cache_directory: ../workspace/training/cache/github-metadata
    # 周期训练必须允许 ETag 刷新，避免把 8 月以前的仓库 metadata 带进 11 月模型。
    reuse_cached_payloads: false
    token_env: GITHUB_TOKEN
    api_version: "2026-03-10"

dataset:
  # 保持与 v13 相同的训练/验证窗口长度，只移动到最新数据水位附近，便于对比数据更新收益。
  train_end: "2026-06-01T00:00:00Z"
  validation_end: "2026-10-01T00:00:00Z"
  minimum_repositories_per_subject: 5
  maximum_repositories_per_subject: 200
  minimum_repository_interactions: 20
  maximum_repository_count: 5000
  subject_sample_rate: 0.02

training:
  reference_time: "2026-06-01T00:00:00Z"
  top_k: 100
  svd_components: 64
  svd_maximum_interactions: 2000000
  svd_maximum_subjects: 100000
  svd_maximum_repositories: 5000
  svd_neighbor_batch_size: 500
  half_life_days: 365
  legacy_time_weight: 0.35
  shrinkage: 10
  minimum_support: 2
  maximum_repositories_per_subject: 100
  maximum_pair_observations: 50000000
  run_ablations: false

evaluation:
  split: validation
  k: 20
  maximum_subjects: 10000

publish:
  # 只安装本地 Registry；不配置 recommend_api，因此不会触达生产服务。
  model_version: gharchive-local-2016-20261031-v14
  selected_model: costar
  metric_gates: {}
