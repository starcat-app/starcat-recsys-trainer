run_id: gharchive-2026-08
workspace: ../workspace/gharchive-2026-08
registry: ../workspace/registry
random_seed: 42

sources:
  - type: bigquery
    billing_project: replace-with-your-gcp-project
    start_date: "2026-08-01"
    end_date: "2026-08-07"
    maximum_bytes_billed_per_day: 10737418240
    location: US
  - type: github_api
    repo_ids_from_canonical: true
    repository_limit: 5000
    maximum_requests: 5000
    token_env: GITHUB_TOKEN
    api_version: "2026-03-10"

dataset:
  train_end: "2026-08-05T00:00:00Z"
  validation_end: "2026-08-07T00:00:00Z"
  minimum_repositories_per_subject: 2

training:
  reference_time: "2026-08-05T00:00:00Z"
  top_k: 100
  svd_components: 64
  half_life_days: 365
  legacy_time_weight: 0.35
  shrinkage: 10
  minimum_support: 1
  maximum_repositories_per_subject: 2000
  run_ablations: true

evaluation:
  split: validation
  k: 20

publish:
  model_version: gharchive-2026-08-v1
  selected_model: costar
  metric_gates: {}
